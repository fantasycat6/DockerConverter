<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>注册 — DockerConverter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2330;
      --border: #30363d; --text: #e6edf3; --text-dim: #8b949e;
      --accent: #2f81f7; --accent-h: #388bfd; --ok: #3fb950; --err: #f85149;
      --radius: 8px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.6; display: flex; align-items: center; justify-content: center; }

    .card {
      width: 100%; max-width: 440px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 36px 32px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .logo-text h1 { font-size: 18px; font-weight: 700; }
    .logo-text .sub { font-size: 12px; color: var(--text-dim); }

    .info-box {
      background: rgba(47,129,247,.1); border: 1px solid rgba(47,129,247,.3);
      border-radius: var(--radius); padding: 10px 12px; font-size: 12px;
      color: var(--text-dim); margin-bottom: 20px; line-height: 1.6;
    }
    .info-box strong { color: var(--accent); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-dim); margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 36px 9px 12px; background: var(--surface2);
      color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    .pwd-wrap { position: relative; }
    .pwd-wrap input { width: 100%; padding-right: 36px; }
    .pwd-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 14px; padding: 2px 4px; line-height: 1;
    }
    .pwd-toggle:hover { color: var(--text); }

    .btn {
      width: 100%; padding: 10px; border-radius: var(--radius);
      border: none; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .15s; margin-top: 8px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }

    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--text); margin-top: 12px;
    }
    .btn-ghost:hover { background: var(--surface2); }

    .error-msg { color: var(--err); font-size: 13px; margin-top: 8px; min-height: 20px; }
    .hint { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 20px; }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.2); border-top-color: #fff;
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning .btn-text { display: none; }
    .spinning .spinner { display: inline-block; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 20px; font-size: 13px;
      color: var(--text); opacity: 0; transition: opacity .25s;
      pointer-events: none; z-index: 9999;
    }
    #toast.show { opacity: 1; }
    #toast.ok   { border-color: var(--ok); }
    #toast.err  { border-color: var(--err); }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text);">
      <div class="logo">🐳</div>
      <div class="logo-text">
        <h1>DockerConverter</h1>
        <div class="sub">docker run → docker-compose.yml</div>
      </div>
    </a>
  </div>
  <div style="text-align: right; margin-bottom: 20px;">
    <a href="/help" style="color: var(--text-dim); font-size: 12px; text-decoration: none;">📖 帮助</a>
  </div>
  <div class="info-box" id="info-box">
    <strong>首位注册用户</strong>将自动获得 <strong>管理员</strong> 权限。
    之后注册的用户为普通用户。
  </div>

  <form id="reg-form" onsubmit="return handleRegister(event)">
    <div class="form-group">
      <label for="username">用户名</label>
      <input id="username" type="text" placeholder="至少 3 个字符" autocomplete="username" required />
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <div class="pwd-wrap">
        <input id="password" type="password" placeholder="至少 6 个字符" autocomplete="new-password" required />
        <button type="button" class="pwd-toggle" onclick="togglePwd('password')">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label for="password2">确认密码</label>
      <div class="pwd-wrap">
        <input id="password2" type="password" placeholder="再输一次" autocomplete="new-password" required />
        <button type="button" class="pwd-toggle" onclick="togglePwd('password2')">👁</button>
      </div>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <button type="submit" class="btn btn-primary" id="submit-btn">
      <span class="btn-text">注册</span>
      <span class="spinner" style="display:none"></span>
    </button>
  </form>

  <div class="hint">
    已有账号？<a href="/login">立即登录</a>
  </div>
  <div class="hint">
    <a href="/">← 返回转换工具</a>
  </div>
</div>

<div id="toast"></div>

<script>
  // Check if user is already logged in
  (async () => {
    try {
      const res = await fetch("/api/me");
      const data = await res.json();
      if (data.user) {
        // Show logged-in state
        const form = document.getElementById("reg-form");
        const infoBox = document.getElementById("info-box");
        if (form) form.style.display = "none";
        if (infoBox) infoBox.style.display = "none";

        // Create logged-in message
        const loggedInMsg = document.createElement("div");
        loggedInMsg.innerHTML = `
          <div style="text-align: center; padding: 20px 0;">
            <div style="font-size: 48px; margin-bottom: 16px;">👋</div>
            <h3 style="margin-bottom: 12px;">您已登录</h3>
            <p style="color: var(--text-dim); margin-bottom: 20px;">欢迎回来, <strong>${escapeHtml(data.user.username)}</strong></p>
            <a href="/" style="display: inline-block; padding: 10px 24px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600;">
              开始使用工具 →
            </a>
          </div>
        `;
        document.querySelector(".card").insertBefore(loggedInMsg, document.querySelector(".card > div:first-of-type").nextSibling);
      }
    } catch (error) {
      console.error("Failed to check login status:", error);
    }
  })();

  function escapeHtml(str) {
    if (!str) return "";
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const err = document.getElementById("error-msg");
    err.textContent = "";
    const pw1 = document.getElementById("password").value;
    const pw2 = document.getElementById("password2").value;
    if (pw1 !== pw2) {
      err.textContent = "两次密码不一致";
      showToast("两次密码不一致", "err");
      return;
    }
    btn.classList.add("spinning");
    btn.disabled = true;

    try {
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: pw1,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        err.textContent = data.error || "注册失败";
        showToast(data.error || "注册失败", "err");
      } else {
        showToast(`注册成功：${data.message} ✓`, "ok");
        setTimeout(() => window.location.href = "/login", 1500);
      }
    } catch(e) {
      err.textContent = "请求失败：" + e.message;
      showToast("请求失败", "err");
    } finally {
      btn.classList.remove("spinning");
      btn.disabled = false;
    }
  }

  function togglePwd(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === "password" ? "text" : "password";
  }

  let _toastTimer;
  function showToast(msg, type) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.className = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ""; }, 3000);
  }

  // 检查是否已有管理员（静默处理）
  (async () => {
    try {
      const res = await fetch("/api/admin/users");
      if (res.ok) {
        const data = await res.json();
        const hasAdmin = data.users && data.users.some(u => u.role === "admin");
        if (hasAdmin) {
          document.getElementById("info-box").innerHTML =
            "系统已有管理员，普通用户注册后将获得标准权限。";
        }
      }
    } catch {}
  })();
</script>
</body>
</html>
