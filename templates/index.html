<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>DockerConverter — docker run → docker-compose</title>
  <style>
    /* ── Reset & Variables ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1c2330;
      --border:    #30363d;
      --text:      #e6edf3;
      --text-dim:  #8b949e;
      --accent:    #2f81f7;
      --accent-h:  #388bfd;
      --ok:        #3fb950;
      --warn:      #d29922;
      --err:       #f85149;
      --radius:    8px;
      --font-mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Layout ────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header .logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
    header .sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    header .badge {
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      color: var(--text-dim);
    }

    /* ── User menu ───────────────────────────────── */
    .user-menu { position: relative; margin-left: auto; }
    .user-btn {
      display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px;
      border-radius: 20px; border: 1px solid var(--border);
      background: transparent; cursor: pointer; color: var(--text);
      font-size: 13px; transition: all .15s;
    }
    .user-btn:hover { background: var(--surface2); border-color: var(--accent); }
    .user-btn .avatar {
      width: 26px; height: 26px; background: var(--accent);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; font-weight: 700;
    }
    .user-btn .name { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-btn .caret { font-size: 10px; color: var(--text-dim); transition: transform .2s; }
    .user-menu.open .user-btn { background: var(--surface2); border-color: var(--accent); }
    .user-menu.open .caret { transform: rotate(180deg); }

    .dropdown {
      position: absolute; top: calc(100% + 6px); right: 0; min-width: 160px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 4px; z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      opacity: 0; visibility: hidden; transform: translateY(-4px);
      transition: all .15s;
    }
    .user-menu.open .dropdown { opacity: 1; visibility: visible; transform: translateY(0); }

    .dropdown-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 6px;
      color: var(--text-dim); font-size: 13px; cursor: pointer;
      transition: all .1s; text-decoration: none;
    }
    .dropdown-item:hover { background: var(--surface2); color: var(--text); }
    .dropdown-item.danger:hover { background: rgba(248,81,73,.1); color: var(--err); }
    .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

    .role-pill {
      font-size: 10px; padding: 1px 7px; border-radius: 10px;
      font-weight: 600;
    }
    .role-pill.admin { background: rgba(47,129,247,.15); color: var(--accent); }
    .role-pill.user  { background: rgba(139,148,158,.12); color: var(--text-dim); }

    .login-prompt { font-size: 13px; color: var(--text-dim); display: flex; gap: 6px; align-items: center; }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Panel ─────────────────────────────────────────── */
    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-header .icon { font-size: 14px; }
    .panel-header .title { font-size: 13px; font-weight: 600; }
    .panel-header .hint  { font-size: 11px; color: var(--text-dim); margin-left: auto; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Textarea ──────────────────────────────────────── */
    textarea {
      width: 100%;
      flex: 1;
      min-height: 260px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
      transition: border-color .2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--text-dim); }

    /* ── Buttons row ───────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity .15s, background .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-h); }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); }

    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ── Upload label ──────────────────────────────────── */
    .upload-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      transition: background .15s;
    }
    .upload-label:hover { background: var(--surface2); }
    #file-input { display: none; }
    #file-name  { font-size: 12px; color: var(--text-dim); align-self: center; }

    /* ── YAML Preview ──────────────────────────────────── */
    .yaml-wrap {
      flex: 1;
      min-height: 260px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: auto;
      position: relative;
    }
    .yaml-wrap.has-content { border-color: var(--ok); }

    pre#yaml-output {
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre;
      margin: 0;
      min-height: 100%;
    }

    /* YAML 语法高亮 */
    .y-key     { color: #79c0ff; }
    .y-str     { color: #a5d6ff; }
    .y-num     { color: #f2cc60; }
    .y-bool    { color: #ff7b72; }
    .y-comment { color: #8b949e; font-style: italic; }
    .y-dash    { color: #7ee787; }
    .y-anchor  { color: #ffa657; }

    /* placeholder 文字 */
    .yaml-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 260px;
      color: var(--text-dim);
      gap: 8px;
      padding: 24px;
    }
    .yaml-placeholder .ph-icon { font-size: 36px; opacity: .4; }
    .yaml-placeholder p { font-size: 13px; text-align: center; }

    /* ── Output action row ─────────────────────────────── */
    .output-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── Log panel ─────────────────────────────────────── */
    .log-panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.8;
      max-height: 180px;
      overflow-y: auto;
    }
    .log-panel.hidden { display: none; }

    .log-entry { display: flex; gap: 8px; }
    .log-badge {
      flex-shrink: 0;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.8;
    }
    .log-badge.ok    { background: rgba(63,185,80,.2);  color: var(--ok); }
    .log-badge.info  { background: rgba(47,129,247,.15); color: var(--accent); }
    .log-badge.warn  { background: rgba(210,153,34,.2);  color: var(--warn); }
    .log-badge.error { background: rgba(248,81,73,.2);   color: var(--err); }
    .log-msg { color: var(--text-dim); }

    /* ── Stats bar ─────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-dim);
    }
    .stats-bar.hidden { display: none; }
    .stat-ok   { color: var(--ok); }
    .stat-err  { color: var(--err); }

    /* ── Spinner ───────────────────────────────────────── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    .spinning .spinner { display: inline-block; }
    .spinning .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok   { border-color: var(--ok); }
    #toast.err  { border-color: var(--err); }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; overflow-y: auto; }
      .panel { min-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">🐳</div>
    <div>
      <h1>DockerConverter <span class="badge">v2.2</span></h1>
      <div class="sub">docker run → docker-compose.yml</div>
    </div>

    <nav style="margin-left: 24px; display: flex; gap: 8px;">
      <a href="/help" class="nav-link" style="color: var(--text-dim); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; transition: all .15s;" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">📖 帮助</a>
    </nav>

    <!-- 动态用户区域 -->
    <div class="user-menu" id="user-area">
      <div class="login-prompt">
        <a href="/login" class="nav-link">登录</a>
        <a href="/register" class="nav-link" style="border-color:var(--accent);color:var(--accent)">注册</a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <div class="main">

    <!-- Left: Input -->
    <div class="panel">
      <div class="panel-header">
        <span class="icon">✏️</span>
        <span class="title">输入命令</span>
        <span class="hint">支持多条命令、多行续行 \ 、注释 #</span>
      </div>
      <div class="panel-body">

        <textarea
          id="cmd-input"
          spellcheck="false"
          placeholder="在此粘贴 docker run 命令，例如：

docker run -d \
  --name my-nginx \
  -p 80:80 \
  -v ./html:/usr/share/nginx/html:ro \
  --restart unless-stopped \
  nginx:latest"
        ></textarea>

        <div class="btn-row">
          <!-- Convert -->
          <button id="btn-convert" class="btn-primary" onclick="doConvert()">
            <span class="spinner"></span>
            <span class="btn-text">⚡ 转换</span>
          </button>

          <!-- Upload -->
          <label class="upload-label" title="上传 .txt 文件批量处理">
            📂 上传 .txt
            <input id="file-input" type="file" accept=".txt" onchange="doUpload(this)" />
          </label>
          <span id="file-name"></span>

          <!-- Clear -->
          <button class="btn-ghost btn-sm" onclick="clearInput()" title="清空输入">✕ 清空</button>

          <!-- Load sample -->
          <button class="btn-ghost btn-sm" onclick="loadSample()" title="加载示例命令">示例</button>
        </div>

      </div>
    </div>

    <!-- Right: Output -->
    <div class="panel">
      <div class="panel-header">
        <span class="icon">📄</span>
        <span class="title">docker-compose.yml</span>
        <span class="hint" id="svc-count"></span>
      </div>
      <div class="panel-body">

        <!-- Stats -->
        <div class="stats-bar hidden" id="stats-bar">
          <span>解析结果：</span>
          <span class="stat-ok" id="stat-ok"></span>
          <span class="stat-err" id="stat-err"></span>
        </div>

        <!-- YAML preview -->
        <div class="yaml-wrap" id="yaml-wrap">
          <div class="yaml-placeholder" id="yaml-placeholder">
            <span class="ph-icon">📋</span>
            <p>转换后的 docker-compose.yml 将在此处显示</p>
          </div>
          <pre id="yaml-output" style="display:none"></pre>
        </div>

        <!-- Output actions -->
        <div class="output-actions">
          <button id="btn-copy" class="btn-ghost btn-sm" onclick="copyYaml()" disabled>
            📋 复制 YAML
          </button>
          <button id="btn-download" class="btn-ghost btn-sm" onclick="downloadYaml()" disabled>
            ⬇️ 下载 docker-compose.yml
          </button>
        </div>

        <!-- Log panel -->
        <div class="log-panel hidden" id="log-panel"></div>

      </div>
    </div>

  </div><!-- /main -->
</div><!-- /app -->

<!-- Toast -->
<div id="toast"></div>

<script>
  // ── 示例命令（由 Flask 模板注入）──────────────────────
  const SAMPLE = {{ sample | tojson }};

  // ── 当前 YAML 内容 ─────────────────────────────────────
  let _currentYaml = "";

  // ── 当前用户状态 ───────────────────────────────────────
  let _currentUser = null;

  // ── 页面加载时检查登录状态 ──────────────────────────────
  (async () => {
    try {
      const res = await fetch("/api/me");
      const data = await res.json();
      if (data.user) {
        _currentUser = data.user;
        renderUserMenu(data.user);
      } else {
        renderLoginPrompt();
      }
    } catch {
      renderLoginPrompt();
    }
  })();

  function renderUserMenu(user) {
    const area = document.getElementById("user-area");
    const initial = user.username.charAt(0).toUpperCase();
    area.innerHTML = `
      <button class="user-btn" onclick="toggleUserMenu()" type="button">
        <div class="avatar">${initial}</div>
        <span class="name" title="${escHtml(user.username)}">${escHtml(user.username)}</span>
        <span class="caret">▼</span>
      </button>
      <div class="dropdown" id="user-dropdown">
        <div class="dropdown-item" style="pointer-events:none;padding-bottom:8px">
          <div class="avatar" style="width:32px;height:32px;font-size:14px">${initial}</div>
          <div>
            <div style="font-weight:600">${escHtml(user.username)}</div>
            <span class="role-pill ${user.role}" style="font-size:10px">${user.role === "admin" ? "管理员" : "用户"}</span>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <a href="/profile" class="dropdown-item">👤 用户中心</a>
        ${user.role === "admin" ? '<a href="/admin" class="dropdown-item">⚙ 管理面板</a>' : ""}
        <div class="dropdown-divider"></div>
        <div class="dropdown-item danger" onclick="logout()">🚪 退出登录</div>
      </div>`;

    // 点击页面其他区域关闭下拉菜单
    document.addEventListener("click", closeMenuOnClickOutside);
  }

  function toggleUserMenu() {
    const menu = document.getElementById("user-area");
    menu.classList.toggle("open");
    event.stopPropagation();
  }

  function closeMenuOnClickOutside(e) {
    const menu = document.getElementById("user-area");
    if (menu && !menu.contains(e.target)) {
      menu.classList.remove("open");
    }
  }

  function renderLoginPrompt() {
    const area = document.getElementById("user-area");
    area.innerHTML = `
      <div class="login-prompt">
        <a href="/login" class="nav-link">登录</a>
        <a href="/register" class="nav-link" style="border-color:var(--accent);color:var(--accent)">注册</a>
      </div>`;
  }

  async function logout() {
    document.getElementById("user-area").classList.remove("open");
    await fetch("/api/logout", { method: "POST" });
    _currentUser = null;
    renderLoginPrompt();
    window.location.href = "/login";
  }

  // ── 加载示例 ───────────────────────────────────────────
  function loadSample() {
    document.getElementById("cmd-input").value = SAMPLE.trim();
    showToast("示例命令已加载", "ok");
  }

  // ── 清空输入 ───────────────────────────────────────────
  function clearInput() {
    document.getElementById("cmd-input").value = "";
    document.getElementById("file-name").textContent = "";
    document.getElementById("file-input").value = "";
  }

  // ── 转换（粘贴文本）────────────────────────────────────
  async function doConvert() {
    const text = document.getElementById("cmd-input").value.trim();
    if (!text) { showToast("请先输入 docker run 命令", "err"); return; }
    await runConvert("/api/convert", JSON.stringify({ text }), "application/json");
  }

  // ── 上传文件 ───────────────────────────────────────────
  async function doUpload(input) {
    const file = input.files[0];
    if (!file) return;
    document.getElementById("file-name").textContent = file.name;
    const fd = new FormData();
    fd.append("file", file);
    await runConvert("/api/upload", fd, null);
  }

  // ── 通用请求处理 ───────────────────────────────────────
  async function runConvert(url, body, contentType) {
    const btn = document.getElementById("btn-convert");
    btn.classList.add("spinning");
    btn.disabled = true;

    const opts = { method: "POST", body };
    if (contentType) opts.headers = { "Content-Type": contentType };

    try {
      const res  = await fetch(url, opts);
      const data = await res.json();

      if (!res.ok || data.error) {
        showToast(data.error || "服务器错误", "err");
        renderLogs([]);
        return;
      }

      renderResult(data);

    } catch (e) {
      showToast("请求失败：" + e.message, "err");
    } finally {
      btn.classList.remove("spinning");
      btn.disabled = false;
    }
  }

  // ── 转换结果提示（登录后记录历史）─────────────────────
  function renderResult(data) {
    _currentYaml = data.yaml || "";

    // YAML 区域
    const wrap  = document.getElementById("yaml-wrap");
    const pre   = document.getElementById("yaml-output");
    const ph    = document.getElementById("yaml-placeholder");

    if (_currentYaml) {
      pre.innerHTML = highlightYaml(_currentYaml);
      pre.style.display = "block";
      ph.style.display  = "none";
      wrap.classList.add("has-content");
    } else {
      pre.style.display = "none";
      ph.style.display  = "flex";
      wrap.classList.remove("has-content");
    }

    // 按钮状态
    const hasYaml = Boolean(_currentYaml);
    document.getElementById("btn-copy").disabled     = !hasYaml;
    document.getElementById("btn-download").disabled = !hasYaml;

    // 统计条
    const statsBar = document.getElementById("stats-bar");
    if (data.success !== undefined) {
      statsBar.classList.remove("hidden");
      document.getElementById("stat-ok").textContent  = `✔ ${data.success} 个服务`;
      document.getElementById("stat-err").textContent = data.failed ? `✘ ${data.failed} 个失败` : "";
    } else {
      statsBar.classList.add("hidden");
    }

    // 服务数徽标
    document.getElementById("svc-count").textContent =
      data.success ? `${data.success} 个服务` : "";

    // 日志
    renderLogs(data.logs || []);

    if (hasYaml) {
      if (_currentUser) showToast(`转换完成，共 ${data.success} 个服务，已保存历史 ✓`, "ok");
      else               showToast(`转换完成，共 ${data.success} 个服务（登录后可保存历史）`, "ok");
    }
    else          showToast("未找到有效服务，请检查输入", "err");
  }

  // ── 日志渲染 ───────────────────────────────────────────
  function renderLogs(logs) {
    const panel = document.getElementById("log-panel");
    if (!logs || !logs.length) { panel.classList.add("hidden"); return; }

    panel.classList.remove("hidden");
    panel.innerHTML = logs.map(l => `
      <div class="log-entry">
        <span class="log-badge ${l.level}">${l.level}</span>
        <span class="log-msg">${escHtml(l.message)}</span>
      </div>`).join("");
    panel.scrollTop = panel.scrollHeight;
  }

  // ── 复制 YAML ─────────────────────────────────────────
  async function copyYaml() {
    if (!_currentYaml) return;
    try {
      await navigator.clipboard.writeText(_currentYaml);
      showToast("已复制到剪贴板 ✓", "ok");
    } catch {
      showToast("复制失败，请手动复制", "err");
    }
  }

  // ── 下载 YAML ─────────────────────────────────────────
  function downloadYaml() {
    if (!_currentYaml) return;
    const blob = new Blob([_currentYaml], { type: "text/yaml;charset=utf-8" });
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = "docker-compose.yml";
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("下载已开始", "ok");
  }

  // ── YAML 语法高亮（轻量正则版）────────────────────────
  function highlightYaml(raw) {
    return escHtml(raw)
      // 注释
      .replace(/(#.*)$/gm,          '<span class="y-comment">$1</span>')
      // 键名（缩进后跟冒号）
      .replace(/^( *)([\w\-]+)(:)/gm, '$1<span class="y-key">$2$3</span>')
      // 列表项破折号
      .replace(/^( *)(- )/gm,       '$1<span class="y-dash">- </span>')
      // 布尔
      .replace(/\b(true|false|yes|no|on|off)\b/g, '<span class="y-bool">$1</span>')
      // 数字
      .replace(/: (\d[\d.]*)/g,     ': <span class="y-num">$1</span>')
      // 字符串（引号内）
      .replace(/&#39;([^&#39;]*)&#39;/g, '&#39;<span class="y-str">$1</span>&#39;')
      .replace(/&quot;([^&quot;]*)&quot;/g, '&quot;<span class="y-str">$1</span>&quot;');
  }

  // ── Toast 通知 ────────────────────────────────────────
  let _toastTimer;
  function showToast(msg, type) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className   = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ""; }, 2800);
  }

  // ── HTML /属性转义 ─────────────────────────────────────
  function escHtml(str) {
    if (str == null) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // ── 快捷键：Ctrl+Enter 触发转换 ──────────────────────
  document.getElementById("cmd-input").addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); doConvert(); }
  });
</script>
</body>
